<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Contenedor redondeado moderno -->
  <rect width="128" height="128" rx="30" fill="url(#bg)" />
  <rect x="2" y="2" width="124" height="124" rx="28" stroke="#34d399" stroke-opacity="0.25" stroke-width="2" />

  <!-- Ondas de conexión superiores ("Conecta") -->
  <path d="M36 28 C48 16 80 16 92 28" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M46 36 C54 27 74 27 82 36" stroke="url(#emerald)" stroke-width="4" stroke-linecap="round" fill="none" />
  <circle cx="64" cy="43" r="4.5" fill="#f59e0b" />

  <!-- Bloque Edificio Izquierdo -->
  <rect x="24" y="60" width="22" height="44" rx="4" fill="#0f2b20" stroke="#34d399" stroke-width="2.5" />
  <rect x="30" y="68" width="4" height="4" rx="1" fill="#34d399" />
  <rect x="37" y="68" width="4" height="4" rx="1" fill="#34d399" />
  <rect x="30" y="78" width="4" height="4" rx="1" fill="#34d399" />
  <rect x="37" y="78" width="4" height="4" rx="1" fill="#34d399" />
  <rect x="30" y="88" width="4" height="4" rx="1" fill="#34d399" />
  <rect x="37" y="88" width="4" height="4" rx="1" fill="#34d399" />

  <!-- Bloque Edificio Central (Torre Principal) -->
  <rect x="51" y="48" width="26" height="56" rx="5" fill="#041d15" stroke="url(#gold)" stroke-width="3" />
  <rect x="58" y="58" width="4.5" height="5" rx="1" fill="#f59e0b" />
  <rect x="66" y="58" width="4.5" height="5" rx="1" fill="#f59e0b" />
  <rect x="58" y="68" width="4.5" height="5" rx="1" fill="#f59e0b" />
  <rect x="66" y="68" width="4.5" height="5" rx="1" fill="#f59e0b" />
  <rect x="58" y="78" width="4.5" height="5" rx="1" fill="#f59e0b" />
  <rect x="66" y="78" width="4.5" height="5" rx="1" fill="#f59e0b" />
  <rect x="58" y="88" width="4.5" height="5" rx="1" fill="#f59e0b" />
  <rect x="66" y="88" width="4.5" height="5" rx="1" fill="#f59e0b" />

  <!-- Bloque Edificio Derecho -->
  <rect x="82" y="62" width="22" height="42" rx="4" fill="#0f2b20" stroke="#34d399" stroke-width="2.5" />
  <rect x="88" y="70" width="4" height="4" rx="1" fill="#34d399" />
  <rect x="95" y="70" width="4" height="4" rx="1" fill="#34d399" />
  <rect x="88" y="80" width="4" height="4" rx="1" fill="#34d399" />
  <rect x="95" y="80" width="4" height="4" rx="1" fill="#34d399" />
  <rect x="88" y="90" width="4" height="4" rx="1" fill="#34d399" />
  <rect x="95" y="90" width="4" height="4" rx="1" fill="#34d399" />
</svg>
